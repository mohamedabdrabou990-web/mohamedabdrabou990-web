<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="136" viewBox="0 0 1100 136" role="img" aria-label="Terminal typing whoami and returning Mohamed Abdrabou">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a15"/><stop offset="1" stop-color="#0b1110"/></linearGradient>
    <clipPath id="cmd"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" values="0;225;225;0" keyTimes="0;.35;.8;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="out"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" values="0;0;740;740;0" keyTimes="0;.34;.7;.86;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect x="1" y="1" width="1098" height="134" rx="12" fill="url(#panel)" stroke="#00ff75" stroke-opacity=".38"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="38" cy="18" r="5" fill="#febc2e"/><circle cx="56" cy="18" r="5" fill="#28c840"/>
  <text x="76" y="22" fill="#8aa096" font-family="monospace" font-size="12">m0x1@security-lab: ~</text>
  <path d="M20 37H1080" stroke="#24372d"/>
  <text x="24" y="68" fill="#00ff75" font-family="monospace" font-size="17">┌─[m0x1@security-lab]─[~]</text>
  <text x="24" y="96" fill="#00e5ff" font-family="monospace" font-size="17">└──╼ $</text>
  <g clip-path="url(#cmd)"><text x="94" y="96" fill="#e3f7eb" font-family="monospace" font-size="17">whoami</text></g>
  <rect x="94" y="79" width="9" height="20" fill="#00ff75"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#out)"><text x="24" y="122" fill="#b6ffd0" font-family="monospace" font-size="15">Mohamed Abdrabou — cybersecurity student focused on SOC operations</text></g>
</svg>
