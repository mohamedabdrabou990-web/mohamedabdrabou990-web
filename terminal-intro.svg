<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="118" viewBox="0 0 1100 118" role="img" aria-label="Linux terminal types whoami and keeps Mohamed Abdrabou's profile visible">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a15"/><stop offset="1" stop-color="#0b1110"/></linearGradient>
    <clipPath id="typed-command"><rect x="0" y="0" width="0" height="22"><animate attributeName="width" from="0" to="60" begin="1.5s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="typed-output"><rect x="0" y="0" width="0" height="22"><animate attributeName="width" from="0" to="675" begin="3.25s" dur="2.8s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect x="1" y="1" width="1098" height="116" rx="12" fill="url(#panel)" stroke="#26332c"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="38" cy="18" r="5" fill="#febc2e"/><circle cx="56" cy="18" r="5" fill="#28c840"/>
  <text x="76" y="22" fill="#8b949e" font-family="monospace" font-size="12">m0x1@security-lab: ~</text>
  <path d="M20 36H1080" stroke="#30363d"/>
  <text x="22" y="62" fill="#c9d1d9" font-family="monospace" font-size="14">┌─[m0x1@security-lab]─[~]</text>
  <text x="22" y="84" fill="#c9d1d9" font-family="monospace" font-size="14">└──╼ $</text>
  <g clip-path="url(#typed-command)"><text x="83" y="84" fill="#c9d1d9" font-family="monospace" font-size="14">whoami</text></g>
  <rect x="83" y="72" width="8" height="15" fill="#c9d1d9"><animate attributeName="x" values="83;143;143;83" keyTimes="0;.38;.92;1" dur="3.25s" fill="freeze"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.92;1" dur="3.25s" fill="freeze"/></rect>
  <g clip-path="url(#typed-output)"><text x="44" y="105" fill="#c9d1d9" font-family="monospace" font-size="13">Mohamed Abdrabou — cybersecurity student focused on SOC operations</text></g>
</svg>
